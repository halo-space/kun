[package]
name = "halo-spider"
version = "0.0.5"
edition = "2024"
description = "A fast, async web crawling framework inspired by Scrapy, built in Rust"
license = "MIT"
repository = "https://github.com/halo-space/kun"
keywords = ["spider", "crawler", "scraper", "async", "web"]
categories = ["web-programming", "asynchronous"]

[features]
default = []
# Real browser automation via Playwright
browser = ["dep:playwright-rs"]
# Open URLs in system browser (e.g. for debugging)
open-browser = ["dep:webbrowser"]
# AI-powered content extraction via OpenAI
ai-selector = ["dep:async-openai"]

[dependencies]
regex = "1.12.3"
scraper = "0.25.0"
ego-tree = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0"
toml = "1.0.3"
reqwest = { version = "0.13.2", features = ["json", "cookies"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "signal", "time"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }
xrust = "2.0.3"
fastrace = { version = "0.7", features = ["enable"] }
url = "2.5"
playwright-rs = { version = "0.8.7", optional = true }
webbrowser = { version = "1", optional = true }
async-openai = { version = "0.34", optional = true, features = ["responses"] }
futures = "0.3.32"
jiff = "0.2.23"
encoding_rs = "0.8.35"
chardetng = "0.1.17"
flate2 = "1.1.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "json"] }
rdkafka = { version = "0.39", features = ["cmake-build"] }
redis = { version = "1", default-features = false, features = ["aio", "tokio-comp"] }
opentelemetry = { version = "0.31", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.31.1", default-features = false, features = ["metrics", "http-proto", "reqwest-blocking-client"] }
